<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Drop Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Concentric GIS Radar / Map Grid Circles -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="270" r="90"  fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Pipeline Network Lines (Symbolizing Water Distribution) -->
  <path d="M 80 340 Q 180 380 256 340 T 432 340" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round"/>
  <path d="M 110 390 Q 200 420 256 390 T 402 390" fill="none" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Badge Disc -->
  <circle cx="256" cy="245" r="145" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- Main Water Droplet (3D styled) -->
  <path d="M 256 130 
           C 256 130, 175 235, 175 285 
           A 81 81 0 0 0 337 285 
           C 337 235, 256 130, 256 130 Z" 
        fill="url(#dropGrad)" 
        filter="url(#shadowGlow)"/>

  <!-- Droplet Curved Highlight -->
  <path d="M 256 150 
           C 256 150, 195 240, 195 280 
           A 61 61 0 0 0 240 335 
           C 210 310, 210 260, 245 200 
           C 252 188, 256 170, 256 150 Z" 
        fill="url(#highlightGrad)"/>

  <!-- GIS Location Pin Center Dot & Wave -->
  <circle cx="256" cy="280" r="18" fill="#ffffff"/>
  <circle cx="256" cy="280" r="10" fill="#0284c7"/>

  <!-- Water Wave Base Inside Droplet -->
  <path d="M 190 295 Q 223 310 256 295 T 322 295 A 81 81 0 0 1 190 295 Z" fill="#0284c7" opacity="0.4"/>

  <!-- Brand Pill Footer -->
  <rect x="136" y="420" width="240" height="38" rx="19" fill="#ffffff" opacity="0.95" filter="url(#cardShadow)"/>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#0369a1" text-anchor="middle" letter-spacing="1.5">SPAM LANDORUNDUN</text>
</svg>

